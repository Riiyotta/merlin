                  - heading "Meeting summary" [level=4] [ref=f22e792]
                  - paragraph [ref=f22e793]: The team aligned on a focused October 9 launch for Common Ground. The first release will introduce the studio’s three core services, with a clear story across the website and launch deck.
                  - paragraph [ref=f22e794]: Leo will share the revised designs on Wednesday. Amira will build the deck around the approved direction, leaving Thursday for Sophie’s feedback and final copy changes.
